name: Fork Android Release

on:
  push:
    tags:
      - '*-widget-card.*'

permissions:
  contents: write

concurrency:
  group: fork-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.repository == 'Darkaxt/feed-flow' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Reconstruct and verify release keystore
        env:
          FORK_KEYSTORE_BASE64: ${{ secrets.FORK_KEYSTORE_BASE64 }}
          FORK_KEYSTORE_SHA256: ${{ secrets.FORK_KEYSTORE_SHA256 }}
          FORK_KEY_ALIAS: ${{ secrets.FORK_KEY_ALIAS }}
          FORK_KEY_PASSWORD: ${{ secrets.FORK_KEY_PASSWORD }}
          FORK_KEYSTORE_PASSWORD: ${{ secrets.FORK_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          for required_secret in \
            FORK_KEYSTORE_BASE64 \
            FORK_KEYSTORE_SHA256 \
            FORK_KEY_ALIAS \
            FORK_KEY_PASSWORD \
            FORK_KEYSTORE_PASSWORD; do
            if [[ -z "${!required_secret:-}" ]]; then
              printf 'Missing required signing secret: %s\n' "$required_secret" >&2
              exit 1
            fi
          done

          printf '%s' "$FORK_KEYSTORE_BASE64" | base64 --decode > androidApp/release.keystore

          expected_sha256="$(
            printf '%s' "$FORK_KEYSTORE_SHA256" |
              tr -d '[:space:]' |
              tr '[:upper:]' '[:lower:]'
          )"
          actual_sha256="$(sha256sum androidApp/release.keystore | cut -d ' ' -f 1)"
          if [[ ! "$expected_sha256" =~ ^[0-9a-f]{64}$ ]] || \
            [[ "$actual_sha256" != "$expected_sha256" ]]; then
            printf 'Release keystore SHA-256 verification failed.\n' >&2
            exit 1
          fi

          {
            printf '%s\n' 'storeFile=release.keystore'
            printf 'keyAlias=%s\n' "$FORK_KEY_ALIAS"
            printf 'storePassword=%s\n' "$FORK_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$FORK_KEY_PASSWORD"
            printf '%s\n' 'dropbox_key='
          } > keystore.properties

      - name: Provide runtime Firebase configuration
        run: |
          set -euo pipefail
          mkdir -p androidApp/src/release
          install -m 600 config/dummy-google-services.json androidApp/src/debug/google-services.json
          install -m 600 config/dummy-google-services.json androidApp/src/release/google-services.json

      - name: Refresh translations
        run: bash .scripts/refresh-translations.sh

      - name: Run release gate
        run: >-
          ./gradlew --quiet --console=plain
          detekt allTests :androidApp:assembleFDroidRelease

      - name: Locate and checksum signed APK
        id: artifact
        run: |
          set -euo pipefail
          shopt -s nullglob

          source_apks=(androidApp/build/outputs/apk/fdroid/release/*.apk)
          if (( ${#source_apks[@]} != 1 )); then
            printf 'Expected exactly one F-Droid release APK, found %d.\n' "${#source_apks[@]}" >&2
            exit 1
          fi

          artifact_tag="$(printf '%s' "$GITHUB_REF_NAME" | LC_ALL=C tr -c 'A-Za-z0-9._-' '-')"
          release_dir="$RUNNER_TEMP/fork-android-release"
          apk_name="FeedFlow-${artifact_tag}.apk"
          mkdir -p "$release_dir"
          mv -- "${source_apks[0]}" "$release_dir/$apk_name"

          (
            cd "$release_dir"
            sha256sum "$apk_name" > "$apk_name.sha256"
          )

          {
            printf 'apk_path=%s\n' "$release_dir/$apk_name"
            printf 'checksum_path=%s\n' "$release_dir/$apk_name.sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        env:
          APK_PATH: ${{ steps.artifact.outputs.apk_path }}
        run: |
          set -euo pipefail

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" ]]; then
            printf 'Android SDK location is unavailable.\n' >&2
            exit 1
          fi

          mapfile -t apksigner_candidates < <(
            for candidate in "$sdk_root"/build-tools/*/apksigner; do
              if [[ -x "$candidate" ]]; then
                printf '%s\n' "$candidate"
              fi
            done | sort -V
          )
          if (( ${#apksigner_candidates[@]} == 0 )); then
            printf 'No Android build-tools apksigner executable was found.\n' >&2
            exit 1
          fi
          apksigner="${apksigner_candidates[${#apksigner_candidates[@]} - 1]}"

          if ! verification_output="$("$apksigner" verify --verbose --print-certs "$APK_PATH" 2>&1)"; then
            printf '%s\n' "$verification_output" >&2
            printf 'APK signature verification failed.\n' >&2
            exit 1
          fi
          printf '%s\n' "$verification_output"

          if [[ "${verification_output,,}" == *'cn=android debug'* ]]; then
            printf 'APK is signed with the Android Debug certificate.\n' >&2
            exit 1
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.artifact.outputs.apk_path }}
          CHECKSUM_PATH: ${{ steps.artifact.outputs.checksum_path }}
        run: |
          set -euo pipefail

          notes_file="$RUNNER_TEMP/fork-android-release-notes.md"
          cat > "$notes_file" <<'EOF'
          ## Fork-signed Android build

          This APK was built from the tagged `Darkaxt/feed-flow` source and signed with the fork's release key.

          ### Configurable widget Card appearance

          - Widget Card slabs can be configured with surface color and opacity, corner radius, spacing/divider/no separation, and divider opacity.
          - Article images can use compact thumbnails or fill the Card row height.

          ### Package and version implications

          This build keeps FeedFlow's production application ID, `com.prof18.feedflow`. Its version name comes from the tagged source and its version code is generated for this GitHub Actions run. Because it uses a different signing key from upstream FeedFlow, Android cannot install it as an upgrade over the upstream app; the matching application ID also means the two builds cannot be installed side by side.

          ### Validation scope

          The Gradle automated tests, Detekt gate, release assembly, checksum, and APK signature verification ran in GitHub Actions. Android CLI, Maestro, and a device matrix were not run.
          EOF

          gh release create "$GITHUB_REF_NAME" \
            "$APK_PATH" \
            "$CHECKSUM_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "FeedFlow fork build $GITHUB_REF_NAME" \
            --notes-file "$notes_file"

      - name: Clean reconstructed signing material
        if: ${{ always() }}
        run: |
          rm -f -- androidApp/release.keystore keystore.properties
          rm -f -- androidApp/src/debug/google-services.json androidApp/src/release/google-services.json
          rmdir androidApp/src/release 2>/dev/null || true
